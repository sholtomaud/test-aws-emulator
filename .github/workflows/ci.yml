name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make typecheck
      - run: make test-unit
      - name: Report to the job summary
        if: always()
        run: make report

  emulator:
    name: Functional, smoke and e2e tests (AWS Emulator in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMULATOR_RUNTIME: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the browser for e2e tests
        run: npx playwright install --with-deps chromium
      - name: Build the AWS Emulator image
        run: make emulator-build
      - name: Start AWS Emulator
        run: make emulator-up
      - name: Functional tests
        run: make test-functional
      - name: Deploy the stack to AWS Emulator
        run: make deploy
      - name: Smoke tests
        run: make test-smoke
      - name: End-to-end tests
        run: make test-e2e
      # Test results plus the emulator report (version, runtime, deployed
      # resources, log) go to the job summary via $GITHUB_STEP_SUMMARY.
      - name: Report to the job summary
        if: always()
        run: make report
      - name: Emulator log
        if: failure()
        run: make emulator-logs
      - name: Stop AWS Emulator
        if: always()
        run: make emulator-down

  dev-container:
    # The macOS workflow (no Node.js on the host), exercised here on Docker:
    # every suite runs inside the dev image built from the Containerfile.
    name: All suites inside the dev container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      USE_CONTAINER: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image (AWS Emulator + Node.js)
        run: make dev-build
      - name: Typecheck, deploy and run every suite in the container
        run: make test
      - name: Report to the job summary
        if: always()
        run: make report >> "$GITHUB_STEP_SUMMARY"
      - name: Emulator log
        if: failure()
        run: scripts/dev-container.sh logs
      - name: Stop the dev container
        if: always()
        run: make dev-down
